<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RedFetcher{% endblock %}</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/fonts/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <div class="app">
      <header class="header">
        <div class="header-inner">
          <a href="/" class="logo"
            ><span class="logo-accent">Red</span>Fetcher</a
          >
          <nav class="nav" role="navigation" aria-label="Main navigation">
            <a href="/" {% if request.path == "/" %}class="active"{% endif %}
              >Subreddits</a
            >
            <a
              href="/posts"
{%
                if request.path == "/posts"
              %}
                class="active"
              {% endif %}
              >Posts</a
            >
            <a
              href="/bookmarks"
{%
                if request.path == "/bookmarks"
              %}
                class="active"
              {% endif %}
              >Bookmarks</a
            >
          </nav>
          <div class="spacer"></div>
          <div class="header-search">
            <div class="search-wrap">
              <span class="search-icon" aria-hidden="true"
                ><i class="fa-solid fa-magnifying-glass"></i
              ></span>
              <form
                method="get"
                action="/posts"
                role="search"
                aria-label="Search posts by title"
              >
                <input
                  type="text"
                  name="q"
                  id="header-search-input"
                  placeholder="Search posts…"
                  aria-label="Search posts by title"
                />
              </form>
            </div>
          </div>
          <a href="/posts" class="header-cta">Browse all</a>
        </div>
      </header>

      <main class="content" id="main-content" role="main">
        {% block content %}{% endblock %}
      </main>

      <footer class="footer">
        <span>RedFetcher v2</span>
        <span class="sep">&middot;</span>
        <span>Locally run. SQLite.</span>
      </footer>
    </div>

    <div class="spinner-container" id="spinner-container">
      <div class="spinner"></div>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
